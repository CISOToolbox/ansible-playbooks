---
# Recovery after losing the host.
#
# Rebuilds the suite on a FRESH host and restores a designated backup there,
# from the off-site repository. It assumes no access to the old machine: the
# repository passphrase and the S3 credentials are enough.
#
#   ansible-playbook restore.yml --limit <host> \
#     -e restore_repo=2 -e restore_target=latest
#
#   ansible-playbook restore.yml --limit <host> \
#     -e restore_repo=2 -e '{"restore_target": "2026-08-22 20:00:00+00"}'
#
#   ansible-playbook restore.yml --limit <host> \
#     -e restore_repo=2 -e restore_modules="pilot,risk"
#
# ⚠ A timestamped target REQUIRES the JSON form above. With `-e key=value`,
#   Ansible splits on spaces: "2026-08-22 20:00:00+00" becomes "2026-08-22"
#   and you restore to MIDNIGHT with no warning at all, losing the twenty
#   hours you meant to keep. An assertion now refuses a date without a time,
#   precisely to make this trap loud.
#
# `restore_target` accepts "latest", a point in time, or a backup label
# (`pgbackrest info` lists them).
#
# ⚠ OVERWRITES the data of the restored modules. The playbook demands an
# explicit confirmation — a recovery playbook is run under pressure, which is
# exactly when one targets the wrong host.
- name: "CISO Toolbox — restore"
  hosts: ciso
  become: true
  gather_facts: true

  vars:
    restore_repo: 2
    restore_target: "latest"
    restore_modules: ""
    restore_confirm: ""

  pre_tasks:
    - name: Require an explicit confirmation
      ansible.builtin.assert:
        that: restore_confirm == inventory_hostname
        fail_msg: >-
          This operation OVERWRITES the databases of "{{ inventory_hostname }}".
          Re-run with -e restore_confirm={{ inventory_hostname }} to confirm
          this is the intended host.

    # A bare date is almost always the symptom of an `-e key=value` split on
    # a space, not an intention. Restoring to midnight when 8pm was meant is
    # only noticed afterwards, when the missing data is looked for — hence
    # this refusal, rather than a silent default.
    - name: Refuse an ambiguous timestamped target
      ansible.builtin.assert:
        that: restore_target is not match('^\d{4}-\d{2}-\d{2}$')
        fail_msg: >-
          restore_target is "{{ restore_target }}" — a date with no time.
          If you passed `-e restore_target=…` containing a space, Ansible
          truncated it and the restore would target MIDNIGHT. Use the JSON
          form: -e '{"restore_target": "{{ restore_target }} 00:00:00+00"}',
          with the time you actually mean.

    - name: Modules to restore
      ansible.builtin.set_fact:
        _mods: >-
          {{ (restore_modules | length > 0)
             | ternary(restore_modules.split(','), ciso_backup_expect_stanzas) }}

    - name: What is about to happen
      ansible.builtin.debug:
        msg: >-
          Restoring from repository {{ restore_repo }}
          (target "{{ restore_target }}") on {{ inventory_hostname }},
          modules: {{ _mods | join(', ') }}.

  roles:
    # The same roles as site.yml, in the same order. A recovery targets a
    # FRESH host: the deployment account, Docker and the base packages are
    # not there yet. Loading ciso_stack alone failed on the very first task
    # with "chown failed: failed to look up user <account>" — the account is
    # created by `common`, which was never reached.
    - { role: common,   tags: [common] }
    - { role: docker,   tags: [docker] }
    - { role: firewall, tags: [firewall] }
    # Installs the suite if absent, converges if present. The databases start
    # empty on a fresh host — that is expected, the restore fills them next.
    - { role: ciso_stack, tags: [stack] }

  post_tasks:
    # Order matters. Restoring under a running database would corrupt the
    # data directory: PostgreSQL writes while pgBackRest replaces the files
    # underneath it.
    - name: Stop the targeted applications and databases
      ansible.builtin.command:
        cmd: "docker compose stop {{ item }}-app {{ item }}-db"
        chdir: "{{ ciso_deploy_dir }}"
      loop: "{{ _mods }}"
      changed_when: true

    # The restore runs in the DATABASE container, not in the agent: the agent
    # mounts the data directories READ-ONLY — deliberately, it only needs to
    # read them to back up. Restoring there fails with
    # "unable to remove '/pg/<m>/global/pg_control': Read-only file system".
    # The database container mounts its PGDATA writable and already carries
    # the whole pgBackRest configuration through environment variables.
    #
    # --delta compares files instead of re-downloading everything: on a fresh
    # host there is nothing to compare, but on a partial recovery it avoids
    # pulling back gigabytes that are already there.
    - name: Restore each database
      ansible.builtin.command:
        argv: >-
          {{ ['docker', 'compose', 'run', '--rm', '--no-deps',
              '--entrypoint', 'pgbackrest', item ~ '-db',
              '--stanza=' ~ item, '--repo=' ~ restore_repo,
              '--pg1-path=/pg/' ~ item, '--delta']
             + (restore_target == 'latest') | ternary(
                 [],
                 (restore_target is match('^\\d{4}-\\d{2}-\\d{2}'))
                 | ternary(['--type=time', '--target=' ~ restore_target,
                            '--target-action=promote'],
                           ['--set=' ~ restore_target]))
             + ['restore'] }}
        chdir: "{{ ciso_deploy_dir }}"
      loop: "{{ _mods }}"
      changed_when: true

    - name: Restart the databases
      ansible.builtin.command:
        cmd: "docker compose start {{ item }}-db"
        chdir: "{{ ciso_deploy_dir }}"
      loop: "{{ _mods }}"
      changed_when: true

    # A restore to a point in time before a migration leaves the schema
    # behind the code. Modules apply Alembic when they start: restarting them
    # AFTER the databases is enough, but it must be verified — hence the
    # trace below.
    - name: Restart the applications
      ansible.builtin.command:
        cmd: "docker compose start {{ item }}-app"
        chdir: "{{ ciso_deploy_dir }}"
      loop: "{{ _mods }}"
      changed_when: true

    - name: Wait for the services to become healthy
      ansible.builtin.shell:
        cmd: >-
          docker compose ps --format '{% raw %}{{.Service}} {{.Health}}{% endraw %}'
          | grep -- '-app ' | grep -cv healthy || true
        chdir: "{{ ciso_deploy_dir }}"
      register: _unhealthy
      until: _unhealthy.stdout | trim == "0"
      retries: 30
      delay: 10
      changed_when: false

    - name: Schema revision after the restore
      ansible.builtin.command:
        cmd: >-
          docker compose exec -T {{ item }}-db
          psql -U {{ item }} -d {{ item }} -tAc
          "SELECT version_num FROM alembic_version"
        chdir: "{{ ciso_deploy_dir }}"
      loop: "{{ _mods }}"
      register: _revs
      changed_when: false
      failed_when: false

    - name: Restored state
      ansible.builtin.debug:
        msg: >-
          {{ item.item }}: schema {{ item.stdout | default('?') | trim }}
          {{ '— READ FAILED, database not restored?' if item.rc != 0 else '' }}
      loop: "{{ _revs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Backup checks
      ansible.builtin.include_role:
        name: backup_verify
