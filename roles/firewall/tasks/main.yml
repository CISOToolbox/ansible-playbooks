---
# ═══════════════════════════════════════════════════════════════════════════
# READ THIS BEFORE ENABLING ufw ON A DOCKER HOST
#
# ufw does NOT arbitrate ports published by containers. Docker writes its own
# rules: a DNAT in nat/PREROUTING, then the DOCKER chain reached from FORWARD.
# ufw's rules live in INPUT. A container started with `-p 8080:8080` therefore
# stays reachable from the network EVEN with a `deny incoming` policy active,
# and without any `allow` rule.
#
# Concretely for this stack: only port 22 is really governed by ufw. The
# proxy's 80/443 are published by Docker — allowing them here changes
# nothing, and denying them would not close them.
#
# Closing a published port requires the DOCKER-USER chain, which Docker
# consults before its own rules and never rewrites. This role does not go
# that far: doing it correctly means knowing the organisation's trusted
# networks. Publish only what must be published — that is the real lever.
# ═══════════════════════════════════════════════════════════════════════════

- name: Is ufw installed?
  ansible.builtin.command: which ufw
  register: _ufw_bin
  changed_when: false
  failed_when: false
  check_mode: false      # read-only: must run under --check too

- name: ufw
  ansible.builtin.package:
    name: ufw
    state: present
  when: ciso_firewall_manage | bool

# Defined BEFORE any task that uses it — a missing variable fails the
# condition itself, not the task.
- name: Can ufw be configured here?
  ansible.builtin.set_fact:
    _configurable: >-
      {{ (ciso_firewall_manage | bool)
         and (_ufw_bin.rc == 0 or not ansible_check_mode) }}

# Under --check the installation above is only simulated: the binary does not
# exist and the ufw module would fail on a consequence of the simulation, not
# on a configuration defect. So we skip, and say so.
- name: ufw configuration not simulatable (--check, ufw absent)
  ansible.builtin.debug:
    msg: >-
      ufw is not installed on the host and --check will not install it:
      the rules cannot be evaluated here. A real run will install ufw and
      then apply the rules in the right order.
  when:
    - ciso_firewall_manage | bool
    - not (_configurable | bool)

# Ubuntu ships DEFAULT_FORWARD_POLICY="DROP". But a container's outbound
# traffic goes through FORWARD: Surface scanning, Watch pulling CVE feeds,
# the SMTP relay, `docker compose pull`. Docker installs ACCEPT rules above
# ufw's chains, so enabling ufw breaks nothing AT THE TIME — the outage
# arrives at the first `ufw reload` or `systemctl restart ufw`, which
# reinserts ufw's chains on top. Weeks later, with no apparent link to its
# cause.
#
# So we set the policy to ACCEPT and let Docker arbitrate forwarded traffic —
# which it does anyway, ufw having no grip on it. This relaxes nothing: it
# writes down what is already true, instead of leaving an inoperative DROP
# that will become operative at the worst possible moment.
- name: ufw — do not break container outbound traffic
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
  when: _configurable | bool

# Order matters: allow BEFORE enabling, otherwise `ufw enable` cuts the
# current SSH session and the host becomes unreachable.
- name: ufw — allow service ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ciso_firewall_ports }}"
  when: _configurable | bool

- name: ufw — default policy
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
  when: _configurable | bool

- name: ufw — enabled
  community.general.ufw:
    state: enabled
  when: _configurable | bool

- name: Host firewall not managed by Ansible
  ansible.builtin.debug:
    msg: >-
      ciso_firewall_manage=false: the host firewall is left as it is.
      Check that filtering exists upstream (cloud security group, hypervisor
      firewall) and that only what must be exposed is exposed.
  when: not (ciso_firewall_manage | bool)
