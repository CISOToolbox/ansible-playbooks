---
# The host firewall is NOT managed by default. Two reasons.
#
# 1. It is an organisational policy. Many hosts are already protected
#    upstream (cloud security group, hypervisor firewall, nftables owned by
#    the operator). Imposing ufw on a production host repeats the mistake of
#    the Docker engine: replacing what works with what the template prefers.
#
# 2. On a Docker host, ufw does NOT do what you think — see the comment in
#    tasks/main.yml. Enabling a "deny incoming" policy that in reality
#    filters none of the published container ports is worse than doing
#    nothing: it grants an assurance that does not exist.
ciso_firewall_manage: false
