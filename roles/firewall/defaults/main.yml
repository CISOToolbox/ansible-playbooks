---
# Le pare-feu hôte n'est PAS géré par défaut. Deux raisons.
#
# 1. C'est une politique d'établissement. Beaucoup d'hôtes sont déjà protégés
#    en amont (groupe de sécurité, pare-feu d'hyperviseur, nftables gérés par
#    l'exploitant). Imposer ufw à un hôte en production, c'est refaire l'erreur
#    du moteur Docker : remplacer ce qui marche par ce que le template préfère.
#
# 2. Sur un hôte Docker, ufw ne fait PAS ce qu'on croit — voir le commentaire
#    de tasks/main.yml. Activer une politique « deny incoming » qui ne filtre
#    en réalité aucun port publié par un conteneur est pire que de ne rien
#    faire : ça donne une assurance qui n'existe pas.
ciso_firewall_manage: false
