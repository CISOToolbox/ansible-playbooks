---
# Deux sources possibles, pilotées par `ciso_docker_source` :
#
#   distro (défaut) — docker.io + docker-compose-v2 + docker-buildx, paquets
#     Ubuntu. Sur 24.04 ils sont à jour (docker.io 29.x, compose 2.40.x) :
#     l'argument historique « la distribution est en retard et n'a pas
#     compose v2 » ne vaut plus. Ils sont signés par Ubuntu, suivis par
#     unattended-upgrades, et n'ajoutent aucun dépôt tiers.
#
#   docker-ce — dépôt officiel Docker Inc. À choisir si une version amont
#     précise est requise. Ajoute une clé et un dépôt tiers à la chaîne
#     d'approvisionnement de l'hôte.
#
# Dans les deux cas, un Docker déjà opérationnel n'est jamais remplacé :
# docker-ce et docker.io sont en conflit, et basculer de l'un à l'autre
# arrête les conteneurs en service.

# Un hôte qui tourne déjà peut avoir Docker par un autre chemin — le paquet
# docker.io d'Ubuntu, typiquement. Or docker-ce et docker.io sont en CONFLIT :
# installer l'un désinstalle l'autre, ce qui arrêterait les conteneurs en
# service. Un rôle d'installation ne doit pas faire ça sur une production.
# On détecte donc l'existant et on ne touche à rien s'il fait l'affaire.
- name: "Docker et compose v2 sont-ils déjà opérationnels ?"
  ansible.builtin.command: docker compose version
  register: _docker_present
  changed_when: false
  failed_when: false

- name: "Docker déjà en place — installation ignorée"
  ansible.builtin.debug:
    msg: >-
      {{ _docker_present.stdout | trim }} déjà présent : le rôle n'installe
      rien. Pour repasser sur le dépôt officiel, désinstallez d'abord la
      version en place — opération à faire hors production, elle arrête les
      conteneurs.
  when: _docker_present.rc == 0

- name: "Docker par les paquets de la distribution"
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - docker-buildx
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: _docker_present.rc != 0 and ciso_docker_source == "distro"

- name: "Clé du dépôt Docker"
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: _docker_present.rc != 0 and ciso_docker_source == "docker-ce"

- name: "Dépôt Docker"
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present
  when: _docker_present.rc != 0 and ciso_docker_source == "docker-ce"

- name: "Docker CE + plugin compose"
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  when: _docker_present.rc != 0 and ciso_docker_source == "docker-ce"

- name: "Service docker actif"
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  # En --check le paquet n'est que simulé : l'unité systemd n'existe pas
  # encore et la tâche échouerait sur une conséquence de la simulation.
  when: not ansible_check_mode

# Volontairement PAS d'ajout au groupe docker : y appartenir équivaut à un
# accès root permanent sur l'hôte, et ce compte est celui qui reçoit les
# connexions SSH. Les commandes docker tournent en root via become, ce qui
# donne le même résultat sans privilège permanent.

- name: "Vérifier que compose v2 répond après installation"
  ansible.builtin.command: docker compose version
  register: _compose_v
  changed_when: false
  when: not ansible_check_mode and _docker_present.rc != 0

- name: "Version de compose"
  ansible.builtin.debug:
    msg: "{{ _compose_v.stdout }}"
  when: not ansible_check_mode and _docker_present.rc != 0

# Les images client sont privées : sans authentification, `compose pull`
# échoue sur elles seules et laisse la stack à moitié à jour.
# Erreur de placement fréquente : ranger vault_registry_password DANS le
# dictionnaire vault_env. Il y serait rendu comme une variable du .env — sans
# usage — et resterait introuvable ici, où Ansible l'attend au premier
# niveau. Le message de Jinja ne dit pas où corriger ; celui-ci le dit.
- name: "Le mot de passe du registre est-il au bon niveau ?"
  ansible.builtin.assert:
    that: vault_registry_password is defined
    fail_msg: >-
      Des images client sont configurées ({{ ciso_client_images.keys() | join(', ') }})
      et ciso_registry_user vaut « {{ ciso_registry_user }} », mais
      vault_registry_password est introuvable.
      Il doit être une clé de PREMIER NIVEAU de group_vars/all/vault.yml,
      SŒUR de vault_env — et non une entrée à l'intérieur de vault_env, qui
      ne contient que les variables destinées au fichier .env.
  when: ciso_client_images | length > 0 and ciso_registry_user | length > 0

- name: "Authentification au registre (images client privées)"
  community.docker.docker_login:
    registry_url: "{{ ciso_registry }}"
    username: "{{ ciso_registry_user }}"
    password: "{{ vault_registry_password }}"
  when: ciso_client_images | length > 0 and ciso_registry_user | length > 0
  no_log: true
