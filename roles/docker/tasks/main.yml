---
# Two possible sources, driven by `ciso_docker_source`:
#
#   distro (default) — docker.io + docker-compose-v2 + docker-buildx, Ubuntu
#     packages. On 24.04 they are current (docker.io 29.x, compose 2.40.x):
#     the historical argument "the distribution lags and has no compose v2"
#     no longer holds. They are signed by Ubuntu, covered by
#     unattended-upgrades, and add no third-party repository.
#
#   docker-ce — Docker Inc.'s official repository. Choose it when a precise
#     upstream version is required. It adds a third-party key and repository
#     to the host's supply chain.
#
# In both cases, a working Docker installation is never replaced: docker-ce
# and docker.io conflict, and switching from one to the other stops the
# containers in service.

# A running host may already have Docker from another path — Ubuntu's
# docker.io package, typically. But docker-ce and docker.io CONFLICT:
# installing one uninstalls the other, which would stop the containers in
# service. An installation role must not do that to a production host.
# So we detect what exists and touch nothing if it does the job.
- name: Are Docker and compose v2 already working?
  ansible.builtin.command: docker compose version
  register: _docker_present
  changed_when: false
  failed_when: false

- name: Docker already present — installation skipped
  ansible.builtin.debug:
    msg: >-
      {{ _docker_present.stdout | trim }} already present: the role installs
      nothing. To switch to the official repository, uninstall the current
      version first — do it outside production hours, it stops the
      containers.
  when: _docker_present.rc == 0

- name: Docker from the distribution packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - docker-buildx
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: _docker_present.rc != 0 and ciso_docker_source == "distro"

- name: Docker repository key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: _docker_present.rc != 0 and ciso_docker_source == "docker-ce"

- name: Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present
  when: _docker_present.rc != 0 and ciso_docker_source == "docker-ce"

- name: Docker CE + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  when: _docker_present.rc != 0 and ciso_docker_source == "docker-ce"

- name: docker service running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  # Under --check the package is only simulated: the systemd unit does not
  # exist yet and the task would fail on a consequence of the simulation.
  when: not ansible_check_mode

# Deliberately NO addition to the docker group: belonging to it is
# equivalent to permanent root access on the host, and this account is the
# one that receives SSH connections. Docker commands run as root through
# become, which gives the same result without a standing privilege.

- name: Check that compose v2 answers after installation
  ansible.builtin.command: docker compose version
  register: _compose_v
  changed_when: false
  when: not ansible_check_mode and _docker_present.rc != 0

- name: compose version
  ansible.builtin.debug:
    msg: "{{ _compose_v.stdout }}"
  when: not ansible_check_mode and _docker_present.rc != 0

# Client images are private: without authentication, `compose pull` fails on
# those alone and leaves the stack half updated.
# A frequent misplacement: putting vault_registry_password INSIDE the
# vault_env dictionary. There it would be rendered as a .env variable — with
# no consumer — and stay unreachable here, where Ansible expects it at the
# top level. Jinja's own message does not say where to fix it; this one does.
- name: Is the registry password at the right level?
  ansible.builtin.assert:
    that: vault_registry_password is defined
    fail_msg: >-
      Client images are configured ({{ ciso_client_images.keys() | join(', ') }})
      and ciso_registry_user is "{{ ciso_registry_user }}", but
      vault_registry_password cannot be found.
      It must be a TOP-LEVEL key of group_vars/all/vault.yml, a SIBLING of
      vault_env — not an entry inside vault_env, which holds only the
      variables destined for the .env file.
  when: ciso_client_images | length > 0 and ciso_registry_user | length > 0

- name: Registry authentication (private client images)
  community.docker.docker_login:
    registry_url: "{{ ciso_registry }}"
    username: "{{ ciso_registry_user }}"
    password: "{{ vault_registry_password }}"
  when: ciso_client_images | length > 0 and ciso_registry_user | length > 0
  no_log: true
