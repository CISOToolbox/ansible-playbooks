---
# Backup checks. Run after a deployment and periodically: a created stanza
# proves nothing, it is the first "full" that opens the recovery window.
# Until it has run, WAL archiving turns without anything to replay onto.

- name: pgBackRest state per module
  ansible.builtin.command:
    cmd: docker compose exec -T backup-agent pgbackrest --stanza={{ item }} info --output=json
    chdir: "{{ ciso_deploy_dir }}"
  loop: "{{ ciso_backup_expect_stanzas }}"
  register: _stanzas
  changed_when: false
  failed_when: false

# Two cases count as "no full backup": the command succeeded but reports no
# full backup, AND the command failed outright — an unreachable stanza is not
# a protected one.
- name: Stanzas without a full backup
  ansible.builtin.set_fact:
    _no_full: >-
      {{ _stanzas.results
         | selectattr('rc', 'equalto', 0)
         | rejectattr('stdout', 'search', '"type":"full"')
         | map(attribute='item') | list
         + _stanzas.results | selectattr('rc', 'ne', 0)
         | map(attribute='item') | list }}

- name: "Alert: no full backup"
  ansible.builtin.debug:
    msg: >-
      No full backup for: {{ _no_full | join(', ') }}.
      The recovery window is NOT open for these modules.
      Force one with:  docker compose exec backup-agent pgbackrest
      --stanza=<module> --type=full backup
  when: _no_full | length > 0

- name: Full backups present everywhere
  ansible.builtin.debug:
    msg: "All stanzas ({{ ciso_backup_expect_stanzas | length }}) have at least one full backup."
  when: _no_full | length == 0
