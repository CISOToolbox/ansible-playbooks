---
# Contrôle des sauvegardes. À jouer après un déploiement et périodiquement :
# une stanza créée ne prouve rien, c'est le premier "full" qui ouvre la
# fenêtre de restauration. Tant qu'il n'est pas passé, l'archivage WAL tourne
# sans rien sur quoi rejouer.

- name: "État pgBackRest par module"
  ansible.builtin.command:
    cmd: docker compose exec -T backup-agent pgbackrest --stanza={{ item }} info --output=json
    chdir: "{{ ciso_deploy_dir }}"
  loop: "{{ ciso_backup_expect_stanzas }}"
  register: _stanzas
  changed_when: false
  failed_when: false

- name: "Stanzas sans sauvegarde complète"
  ansible.builtin.set_fact:
    _no_full: >-
      {{ _stanzas.results
         | selectattr('rc', 'equalto', 0)
         | rejectattr('stdout', 'search', '"type":"full"')
         | map(attribute='item') | list
         + _stanzas.results | selectattr('rc', 'ne', 0)
         | map(attribute='item') | list }}

- name: "Alerte : aucune sauvegarde complète"
  ansible.builtin.debug:
    msg: >-
      Aucun backup full pour : {{ _no_full | join(', ') }}.
      La fenêtre de restauration n'est PAS ouverte pour ces modules.
      Forcer avec :  docker compose exec backup-agent pgbackrest
      --stanza=<module> --type=full backup
  when: _no_full | length > 0

- name: "Sauvegardes complètes présentes partout"
  ansible.builtin.debug:
    msg: "Toutes les stanzas ({{ ciso_backup_expect_stanzas | length }}) ont au moins une sauvegarde complète."
  when: _no_full | length == 0
