---
# Recreate, do not reload: nginx.conf is mounted as a single file, so it is
# bound to its inode, and most editors replace it. `nginx -s reload` would
# re-read the old content — or fail.
#
# Runs as root, like every Docker command in this role. The deployment
# account has no access to /var/run/docker.sock, and adding it to the
# `docker` group would grant the equivalent of root on the host — a
# disproportionate price for recreating one container.
- name: Recreate the proxy
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate proxy
    chdir: "{{ ciso_deploy_dir }}"
  tags: [always]
