---
# Deploys the CISO Toolbox stack from a published release.
#
# Principle: docker-compose.yml and nginx.conf are NEVER hand-written. They
# come from the public repository at tag `ciso_suite_version`, which describes
# a combination of modules tested together. Upgrading = changing that
# variable and replaying.

- name: Deployment directory
  ansible.builtin.file:
    path: "{{ ciso_deploy_dir }}"
    state: directory
    owner: "{{ ciso_deploy_user }}"
    group: "{{ ciso_deploy_user }}"
    mode: "0750"

- name: Fetch release {{ ciso_suite_version }}
  ansible.builtin.git:
    repo: "{{ ciso_suite_repo }}"
    dest: "{{ ciso_deploy_dir }}/suite"
    version: "{{ ciso_suite_version }}"
    depth: 1
    force: true            # files come from the repository, never edited here
  become_user: "{{ ciso_deploy_user }}"
  register: _suite_git

# Three postures, because a certificate does not always arrive the same way:
# provided from the control node, already placed on the host by another tool
# (ACME, corporate PKI), or self-signed for a mock-up.
# File NAMES are variable: the release's nginx.conf expects cert.pem /
# key.pem, but an existing deployment may name them otherwise.
- name: Certificates directory
  ansible.builtin.file:
    path: "{{ ciso_deploy_dir }}/certs"
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags: [certs]

- name: TLS certificates provided from the control node
  ansible.builtin.copy:
    src: "certs/{{ ciso_domain }}/{{ item }}"
    dest: "{{ ciso_deploy_dir }}/certs/{{ item }}"
    owner: "{{ ciso_deploy_user }}"
    mode: "0640"
  loop:
    - "{{ ciso_tls_cert_name }}"
    - "{{ ciso_tls_key_name }}"
  when: ciso_tls_mode == "provided"
  notify: Recreate the proxy
  tags: [certs]

- name: TLS certificates already present on the host
  ansible.builtin.stat:
    path: "{{ ciso_deploy_dir }}/certs/{{ item }}"
  loop:
    - "{{ ciso_tls_cert_name }}"
    - "{{ ciso_tls_key_name }}"
  register: _tls_stat
  when: ciso_tls_mode == "existing"
  tags: [certs]

- name: Check that the existing certificates are really there
  ansible.builtin.assert:
    that: _tls_stat.results | map(attribute='stat.exists') | select | list | length == 2
    fail_msg: >-
      ciso_tls_mode=existing but {{ ciso_deploy_dir }}/certs/ does not contain
      {{ ciso_tls_cert_name }} and {{ ciso_tls_key_name }}. The proxy would
      refuse to start — nginx fails when ssl_certificate points at nothing.
  when: ciso_tls_mode == "existing"
  tags: [certs]

# Mock-ups only: a self-signed certificate lets the proxy start and raise
# TLS, but every browser will show it as untrusted. The SAN covers the domain
# and its subdomains — without that, modules served on a subdomain would fail
# where the root would pass.
- name: Self-signed certificate (mock-up)
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:4096
      - -nodes
      - -days
      - "825"
      - -subj
      - "/CN={{ ciso_domain }}"
      - -addext
      - "subjectAltName=DNS:{{ ciso_domain }},DNS:*.{{ ciso_domain }}"
      - -keyout
      - "{{ ciso_deploy_dir }}/certs/{{ ciso_tls_key_name }}"
      - -out
      - "{{ ciso_deploy_dir }}/certs/{{ ciso_tls_cert_name }}"
    creates: "{{ ciso_deploy_dir }}/certs/{{ ciso_tls_cert_name }}"
  when: ciso_tls_mode == "selfsigned"
  notify: Recreate the proxy
  tags: [certs]

- name: Remind that a self-signed certificate is not trusted
  ansible.builtin.debug:
    msg: >-
      ciso_tls_mode=selfsigned: the proxy serves a self-signed certificate for
      {{ ciso_domain }}. No browser will consider it valid — mock-ups only.
  when: ciso_tls_mode == "selfsigned"
  tags: [certs]

- name: Refuse an unknown TLS mode
  ansible.builtin.assert:
    that: ciso_tls_mode in ["provided", "existing", "selfsigned"]
    fail_msg: >-
      ciso_tls_mode is "{{ ciso_tls_mode }}", which is not recognised.
      With no certificate in place, the proxy loops on a missing
      ssl_certificate. Accepted values: provided, existing, selfsigned.
  tags: [certs]

# Under --check the git module ANNOUNCES the clone without doing it: the tree
# does not exist and everything depending on it would fail on a consequence of
# the simulation. We detect that to skip cleanly, saying what could not be
# evaluated — rather than letting it look like a faulty configuration.
- name: Is the release tree present?
  ansible.builtin.stat:
    path: "{{ ciso_deploy_dir }}/suite/docker-compose.yml"
  register: _suite_tree

- name: What the simulation cannot cover
  ansible.builtin.debug:
    msg: >-
      The release tree is not cloned and --check will not clone it: copying
      the compose file, substituting client images, rendering nginx.conf and
      the `docker compose config` validation are not evaluated here. The
      checks that look at the STATE of the host — data volumes, an already
      running stack — are.
  when: ansible_check_mode and not _suite_tree.stat.exists

# The proxy has no DAC_OVERRIDE, so it needs an explicit permission on the
# private key. Making it world-readable would expose it to every account on
# the host; instead we make the container its OWNER (root in the container =
# root on the host, with no user-namespace remapping), and the owner
# permission is enough.
#
# This applies in "existing" mode too: a privkey.pem placed by certbot or a
# corporate PKI arrives as 0600 for another account, and the proxy then loops
# on "cannot load certificate key ... Permission denied".
- name: Certificates readable by the hardened proxy
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ ciso_deploy_dir }}/certs", mode: "0750" }
    - { path: "{{ ciso_deploy_dir }}/certs/{{ ciso_tls_cert_name }}", mode: "0640" }
    - { path: "{{ ciso_deploy_dir }}/certs/{{ ciso_tls_key_name }}", mode: "0640" }
  loop_control:
    label: "{{ item.path }}"
  notify: Recreate the proxy
  tags: [certs]

- name: docker-compose.yml from the release
  ansible.builtin.copy:
    remote_src: true
    src: "{{ ciso_deploy_dir }}/suite/docker-compose.yml"
    dest: "{{ ciso_deploy_dir }}/docker-compose.yml"
    owner: "{{ ciso_deploy_user }}"
    mode: "0640"
  register: _compose_file
  when: _suite_tree.stat.exists or not ansible_check_mode

# Client images replace the suite image of the module concerned. The release
# tag and digest are stripped: a client image has its own fingerprints, and
# keeping the original digest would make the pull fail.
- name: Substitute client images
  ansible.builtin.replace:
    path: "{{ ciso_deploy_dir }}/docker-compose.yml"
    regexp: '^(\s+image:\s*)\S*ciso-{{ item.key }}-suite:\S+$'
    replace: '\1{{ item.value }}'
  loop: "{{ ciso_client_images | dict2items }}"
  loop_control:
    label: "{{ item.key }} → {{ item.value }}"
  when:
    - ciso_client_images | length > 0
    - _suite_tree.stat.exists or not ansible_check_mode
  register: _client_images

# The S3 overlay comes from the release just like the compose file: it is
# what defines repo2 for the ten databases and for the agent. Copied
# unconditionally — inert as long as COMPOSE_FILE does not reference it.
- name: S3 overlays from the release
  ansible.builtin.copy:
    remote_src: true
    src: "{{ ciso_deploy_dir }}/suite/{{ item }}"
    dest: "{{ ciso_deploy_dir }}/{{ item }}"
    owner: "{{ ciso_deploy_user }}"
    mode: "0640"
  loop:
    - docker-compose.s3.yml
    - docker-compose.s3-ca.yml
  when: _suite_tree.stat.exists or not ansible_check_mode
  failed_when: false      # absent from releases predating FEAT-29

# If the release does not ship the overlay, the .env would point COMPOSE_FILE
# at a missing file and EVERY docker compose command would fail — including
# the ones that keep the stack alive. The trap springs at the exact moment
# one believes they are strengthening their backups.
- name: Does the release provide the S3 overlay?
  ansible.builtin.stat:
    path: "{{ ciso_deploy_dir }}/docker-compose.s3.yml"
  register: _s3_overlay
  when: ciso_backup_s3 | default({}) | length > 0

- name: Refuse to enable S3 on a release that does not support it
  ansible.builtin.assert:
    that: _s3_overlay.stat.exists
    fail_msg: >-
      ciso_backup_s3 is set, but release {{ ciso_suite_version }} does not
      ship docker-compose.s3.yml — off-site backup postdates it. The .env
      would reference a missing file and every docker compose command would
      fail.
      Raise ciso_suite_version to a release that carries off-site backup
      first, or remove ciso_backup_s3.
  when:
    - ciso_backup_s3 | default({}) | length > 0
    - not ansible_check_mode or _s3_overlay.stat is defined

- name: Is the S3 configuration complete?
  ansible.builtin.assert:
    that:
      - ciso_backup_s3.bucket is defined
      - ciso_backup_s3.endpoint is defined
      - ciso_backup_s3_secret.key is defined
      - ciso_backup_s3_secret.key_secret is defined
    fail_msg: >-
      ciso_backup_s3 is set but incomplete. It needs at least bucket +
      endpoint, and in the vault ciso_backup_s3_secret.key and .key_secret.
      A partial configuration would stop the stack from starting: pgBackRest
      refuses an empty variable.
  when: ciso_backup_s3 | default({}) | length > 0

- name: nginx.conf from the release
  ansible.builtin.copy:
    remote_src: true
    src: "{{ ciso_deploy_dir }}/suite/nginx.conf"
    dest: "{{ ciso_deploy_dir }}/nginx.conf"
    owner: "{{ ciso_deploy_user }}"
    mode: "0640"
  when: _suite_tree.stat.exists or not ansible_check_mode
  # An `nginx -s reload` does NOT re-read this file: it is mounted as a
  # single file, therefore bound to its inode, and most editors replace it.
  # Only recreating the container picks the edit up.
  notify: Recreate the proxy

- name: .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ ciso_deploy_dir }}/.env"
    owner: "{{ ciso_deploy_user }}"
    mode: "0600"
  register: _env_file
  no_log: true

- name: Validate the compose file before any start
  ansible.builtin.command:
    cmd: docker compose config -q
    chdir: "{{ ciso_deploy_dir }}"
  changed_when: false
  when: _suite_tree.stat.exists or not ansible_check_mode

# Compose prefixes volumes with the project name. Getting that name wrong
# produces NO error at all: the stack starts on fresh volumes, the databases
# are empty, and the operator concludes data was lost while theirs sleeps
# intact under the other prefix. It is the only move in this role that can
# look like a disaster, hence this explicit check.
- name: Data volumes already present on the host
  ansible.builtin.command:
    cmd: docker volume ls --format '{% raw %}{{.Name}}{% endraw %}'
  register: _volumes
  changed_when: false
  check_mode: false      # read-only: must run under --check too

- name: Does the project name match the existing volumes?
  ansible.builtin.set_fact:
    _project: "{{ ciso_env.COMPOSE_PROJECT_NAME }}"
    _foreign_pgdata: >-
      {{ _volumes.stdout_lines | select('search', '-pgdata$')
         | reject('search', '^' ~ ciso_env.COMPOSE_PROJECT_NAME ~ '_')
         | list }}
    _own_pgdata: >-
      {{ _volumes.stdout_lines
         | select('search', '^' ~ ciso_env.COMPOSE_PROJECT_NAME ~ '_.*-pgdata$')
         | list }}

# An escape hatch for the legitimate case: a host running SEVERAL projects,
# or a disaster recovery where the neighbouring volumes belong to something
# else. Without it, the message advised deleting volumes this deployment does
# not own — the worst possible advice.
- name: Refuse to start next to existing data
  ansible.builtin.assert:
    that: >-
      _own_pgdata | length > 0
      or _foreign_pgdata | length == 0
      or (ciso_allow_new_project | default(false) | bool)
    fail_msg: >-
      COMPOSE_PROJECT_NAME is "{{ _project }}", but no {{ _project }}_*-pgdata
      volume exists while the host carries others:
      {{ _foreign_pgdata | join(', ') }}.
      Starting now would create EMPTY databases next to your data.
      If this is a typo, fix ciso_env.COMPOSE_PROJECT_NAME so it matches the
      prefix above.
      If this deployment is GENUINELY new and those volumes belong to another
      project — several stacks on one host, or a disaster recovery — pass
      -e ciso_allow_new_project=true. Do not delete volumes this deployment
      does not own.
    success_msg: >-
      {{ _own_pgdata | length }} data volume(s) for project "{{ _project }}"
      — the stack will find its databases again.

# Containers carry fixed names (ciso-pilot, ciso-risk-db…). If a stack of the
# same project exists from ANOTHER directory — the case of a move from /home
# to /opt — `up -d` fails on a name conflict with an obscure message. Compose
# labels every container with its originating directory: we query the daemon,
# not the filesystem, and read it to say precisely what to do.
#
# We probe ALL of the project's containers, not just ciso-pilot: a partial
# stack (Pilot removed by hand, other modules left) would otherwise escape the
# check while still breaking the start.
- name: Containers from an existing stack?
  ansible.builtin.command:
    cmd: >-
      docker ps -a
      --filter label=com.docker.compose.project={{ ciso_env.COMPOSE_PROJECT_NAME }}
      --format '{% raw %}{{.Label "com.docker.compose.project.working_dir"}}|{{.State}}{% endraw %}'
  register: _existing
  changed_when: false
  failed_when: false
  check_mode: false      # read-only: must run under --check too

- name: State and origin of the existing containers
  ansible.builtin.set_fact:
    _other_dirs: >-
      {{ _existing.stdout_lines | map('regex_replace', '\|.*$', '')
         | reject('equalto', ciso_deploy_dir) | reject('equalto', '')
         | unique | list }}
    _other_up: >-
      {{ _existing.stdout_lines | select('search', '\|running$')
         | list | length > 0 }}

# `docker compose stop` is NOT enough: it stops containers without removing
# them, and their names stay reserved. That is the natural move when reading
# "a stack is already running", hence the explicit distinction below.
- name: Refuse to start a second stack from another directory
  ansible.builtin.assert:
    that: _other_dirs | length == 0
    fail_msg: >-
      Containers of project "{{ ciso_env.COMPOSE_PROJECT_NAME }}" already
      exist ({{ "some running" if _other_up | bool else "stopped, but still present" }})
      and come from {{ _other_dirs | map('regex_replace', '^(.*)$', '"\1"') | join(', ') }},
      while this deployment targets "{{ ciso_deploy_dir }}". Their names being
      fixed, starting here would fail on a conflict.
      {{ "Careful: `docker compose stop` does not free the names — the containers must be REMOVED." if not (_other_up | bool) else "" }}
      Use `down`, WITHOUT -v which would destroy the volumes:
      {% for d in _other_dirs %}  cd {{ d }} && docker compose down
      {% endfor %}
      The data lives in the {{ ciso_env.COMPOSE_PROJECT_NAME }}_* volumes,
      independent of the directory: it will be found again here.
    success_msg: >-
      No container of project "{{ ciso_env.COMPOSE_PROJECT_NAME }}" comes from
      another directory — no name conflict expected.

# After a move, `down` removes the containers and therefore their `restart`
# policies. But an EXTERNAL mechanism — systemd unit, cron @reboot, rc.local —
# that relaunches the old directory survives the operation and only shows up
# at the next reboot: two stacks then fight over the same container names and
# the same ports, weeks after the switch.
#
# The release relies on `restart: unless-stopped`, so NO external mechanism is
# needed here: anything found is suspect.
- name: Boot-time start mechanisms pointing elsewhere
  ansible.builtin.shell:
    cmd: >-
      grep -rnsE 'docker[ -]compose'
      /etc/systemd/system /etc/cron.d /etc/crontab /var/spool/cron/crontabs
      2>/dev/null | grep -v {{ ciso_deploy_dir | quote }} || true
  register: _boot_hooks
  changed_when: false
  check_mode: false      # read-only: must run under --check too

- name: Warn about a competing automatic start
  ansible.builtin.debug:
    msg: >-
      WARNING — an automatic start mechanism references a deployment other
      than "{{ ciso_deploy_dir }}". At the next reboot, two stacks will fight
      over the same container names.
      The release uses `restart: unless-stopped` and needs no unit and no
      cron entry: disable what follows.
      {{ _boot_hooks.stdout_lines | join(' | ') }}
  when: _boot_hooks.stdout | trim | length > 0

- name: Pull the release images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ ciso_deploy_dir }}"
  changed_when: true

- name: Start the stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ ciso_deploy_dir }}"
  changed_when: true

- name: Wait for the services to become healthy
  ansible.builtin.shell:
    cmd: >-
      docker compose ps --format '{% raw %}{{.Service}} {{.Health}}{% endraw %}'
      | grep -- '-app ' | grep -cv healthy || true
    chdir: "{{ ciso_deploy_dir }}"
  register: _unhealthy
  until: _unhealthy.stdout | trim == "0"
  retries: 30
  delay: 10
  changed_when: false

# The check that was missing during a real migration: neither the contents of
# the compose file nor the absence of errors in the logs prove that a
# container runs on the right image. Only the Image column of `compose ps`
# is authoritative.
- name: Images actually in service
  ansible.builtin.command:
    cmd: docker compose ps --format '{% raw %}{{.Service}}\t{{.Image}}{% endraw %}'
    chdir: "{{ ciso_deploy_dir }}"
  register: _running_images
  changed_when: false

- name: Image summary
  ansible.builtin.debug:
    var: _running_images.stdout_lines
