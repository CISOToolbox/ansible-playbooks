---
# Déploie la stack CISO Toolbox à partir d'une release publiée.
#
# Principe : on ne réécrit JAMAIS docker-compose.yml ni nginx.conf à la main.
# Ils viennent du dépôt public au tag `ciso_suite_version`, qui décrit une
# combinaison de modules testée ensemble. Monter de version = changer cette
# variable et rejouer.

- name: "Répertoire de déploiement"
  ansible.builtin.file:
    path: "{{ ciso_deploy_dir }}"
    state: directory
    owner: "{{ ciso_deploy_user }}"
    group: "{{ ciso_deploy_user }}"
    mode: "0750"

- name: "Récupérer la release {{ ciso_suite_version }}"
  ansible.builtin.git:
    repo: "{{ ciso_suite_repo }}"
    dest: "{{ ciso_deploy_dir }}/suite"
    version: "{{ ciso_suite_version }}"
    depth: 1
    force: true            # les fichiers viennent du dépôt, jamais édités ici
  become_user: "{{ ciso_deploy_user }}"
  register: _suite_git

# Trois postures, parce qu'un certificat n'arrive pas toujours par le même
# chemin : fourni depuis le nœud de contrôle, déjà déposé sur l'hôte par un
# autre outil (ACME, PKI d'entreprise), ou auto-signé pour une maquette.
# Les NOMS de fichiers sont variables : nginx.conf de la release attend
# cert.pem / key.pem, mais un déploiement existant peut les nommer autrement.
- name: "Répertoire des certificats"
  ansible.builtin.file:
    path: "{{ ciso_deploy_dir }}/certs"
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags: [certs]

- name: "Certificats TLS fournis depuis le nœud de contrôle"
  ansible.builtin.copy:
    src: "certs/{{ ciso_domain }}/{{ item }}"
    dest: "{{ ciso_deploy_dir }}/certs/{{ item }}"
    owner: "{{ ciso_deploy_user }}"
    mode: "0640"
  loop:
    - "{{ ciso_tls_cert_name }}"
    - "{{ ciso_tls_key_name }}"
  when: ciso_tls_mode == "provided"
  notify: redémarrer le proxy
  tags: [certs]

- name: "Certificats TLS déjà présents sur l'hôte"
  ansible.builtin.stat:
    path: "{{ ciso_deploy_dir }}/certs/{{ item }}"
  loop:
    - "{{ ciso_tls_cert_name }}"
    - "{{ ciso_tls_key_name }}"
  register: _tls_stat
  when: ciso_tls_mode == "existing"
  tags: [certs]

- name: "Vérifier que les certificats existants sont bien là"
  ansible.builtin.assert:
    that: _tls_stat.results | map(attribute='stat.exists') | select | list | length == 2
    fail_msg: >-
      ciso_tls_mode=existing mais {{ ciso_deploy_dir }}/certs/ ne contient pas
      {{ ciso_tls_cert_name }} et {{ ciso_tls_key_name }}. Le proxy refuserait
      de démarrer — nginx échoue si ssl_certificate pointe dans le vide.
  when: ciso_tls_mode == "existing"
  tags: [certs]

# Maquette uniquement : un certificat auto-signé fait démarrer le proxy et
# lever le TLS, mais tout navigateur l'affichera comme non fiable. Le SAN
# couvre le domaine et ses sous-domaines, faute de quoi les modules servis
# sur un sous-domaine échoueraient là où la racine passerait.
- name: "Certificat auto-signé (maquette)"
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:4096
      - -nodes
      - -days
      - "825"
      - -subj
      - "/CN={{ ciso_domain }}"
      - -addext
      - "subjectAltName=DNS:{{ ciso_domain }},DNS:*.{{ ciso_domain }}"
      - -keyout
      - "{{ ciso_deploy_dir }}/certs/{{ ciso_tls_key_name }}"
      - -out
      - "{{ ciso_deploy_dir }}/certs/{{ ciso_tls_cert_name }}"
    creates: "{{ ciso_deploy_dir }}/certs/{{ ciso_tls_cert_name }}"
  when: ciso_tls_mode == "selfsigned"
  notify: redémarrer le proxy
  tags: [certs]

- name: "Rappeler qu'un certificat auto-signé n'est pas fiable"
  ansible.builtin.debug:
    msg: >-
      ciso_tls_mode=selfsigned : le proxy sert un certificat auto-signé pour
      {{ ciso_domain }}. Aucun navigateur ne le considérera comme valide —
      réservé aux maquettes.
  when: ciso_tls_mode == "selfsigned"
  tags: [certs]

- name: "Refuser un mode TLS inconnu"
  ansible.builtin.assert:
    that: ciso_tls_mode in ["provided", "existing", "selfsigned"]
    fail_msg: >-
      ciso_tls_mode vaut « {{ ciso_tls_mode }} », qui n'est pas reconnu.
      Sans certificat déposé, le proxy boucle sur un ssl_certificate
      introuvable. Valeurs acceptées : provided, existing, selfsigned.
  tags: [certs]

# En --check, le module git ANNONCE le clone sans le faire : l'arbre n'existe
# pas et tout ce qui en dépend échouerait sur une conséquence de la simulation.
# On le détecte pour sauter proprement, en disant ce qui n'a pas pu être
# évalué — plutôt que de laisser croire à une configuration fautive.
- name: "Arbre de la release présent ?"
  ansible.builtin.stat:
    path: "{{ ciso_deploy_dir }}/suite/docker-compose.yml"
  register: _suite_tree

- name: "Ce que la simulation ne peut pas couvrir"
  ansible.builtin.debug:
    msg: >-
      L'arbre de la release n'est pas cloné et --check ne le clone pas :
      la copie du compose, la substitution des images client, le rendu de
      nginx.conf et la validation `docker compose config` ne sont pas
      évalués ici. Les contrôles qui portent sur l'ÉTAT de l'hôte — volumes
      de données, stack déjà en cours d'exécution — le sont, eux.
  when: ansible_check_mode and not _suite_tree.stat.exists

# Le proxy n'ayant pas DAC_OVERRIDE, il lui faut une permission explicite sur
# la clé privée. La rendre lisible par « autres » l'exposerait à tous les
# comptes de l'hôte ; on fait du conteneur son PROPRIÉTAIRE (root dans le
# conteneur = root sur l'hôte, sans remappage d'espace de noms), et la
# permission propriétaire suffit.
#
# S'applique aussi en mode « existing » : un privkey.pem déposé par certbot ou
# une PKI d'entreprise arrive en 0600 pour un autre compte, et le proxy boucle
# alors sur « cannot load certificate key ... Permission denied ».
- name: "Certificats lisibles par le proxy durci"
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ ciso_deploy_dir }}/certs", mode: "0750" }
    - { path: "{{ ciso_deploy_dir }}/certs/{{ ciso_tls_cert_name }}", mode: "0640" }
    - { path: "{{ ciso_deploy_dir }}/certs/{{ ciso_tls_key_name }}", mode: "0640" }
  loop_control:
    label: "{{ item.path }}"
  notify: redémarrer le proxy
  tags: [certs]

- name: "docker-compose.yml de la release"
  ansible.builtin.copy:
    remote_src: true
    src: "{{ ciso_deploy_dir }}/suite/docker-compose.yml"
    dest: "{{ ciso_deploy_dir }}/docker-compose.yml"
    owner: "{{ ciso_deploy_user }}"
    mode: "0640"
  register: _compose_file
  when: _suite_tree.stat.exists or not ansible_check_mode

# Les images client remplacent l'image de suite du module concerné. Le tag
# et le digest de la release sont retirés : une image client a ses propres
# empreintes, et laisser le digest d'origine ferait échouer le pull.
- name: "Substituer les images client"
  ansible.builtin.replace:
    path: "{{ ciso_deploy_dir }}/docker-compose.yml"
    regexp: '^(\s+image:\s*)\S*ciso-{{ item.key }}-suite:\S+$'
    replace: '\1{{ item.value }}'
  loop: "{{ ciso_client_images | dict2items }}"
  loop_control:
    label: "{{ item.key }} → {{ item.value }}"
  when:
    - ciso_client_images | length > 0
    - _suite_tree.stat.exists or not ansible_check_mode
  register: _client_images

- name: "nginx.conf de la release"
  ansible.builtin.copy:
    remote_src: true
    src: "{{ ciso_deploy_dir }}/suite/nginx.conf"
    dest: "{{ ciso_deploy_dir }}/nginx.conf"
    owner: "{{ ciso_deploy_user }}"
    mode: "0640"
  when: _suite_tree.stat.exists or not ansible_check_mode
  # Un `nginx -s reload` NE relit PAS ce fichier : il est monté comme fichier
  # unique, donc lié à son inode, et la plupart des éditeurs le remplacent.
  # Seule une recréation du conteneur prend l'édition en compte.
  notify: redémarrer le proxy

- name: ".env"
  ansible.builtin.template:
    src: env.j2
    dest: "{{ ciso_deploy_dir }}/.env"
    owner: "{{ ciso_deploy_user }}"
    mode: "0600"
  register: _env_file
  no_log: true

- name: "Valider le compose avant tout démarrage"
  ansible.builtin.command:
    cmd: docker compose config -q
    chdir: "{{ ciso_deploy_dir }}"
  changed_when: false
  when: _suite_tree.stat.exists or not ansible_check_mode

# Compose préfixe les volumes par le nom de projet. Se tromper de nom ne
# produit AUCUNE erreur : la stack démarre sur des volumes neufs, les bases
# sont vides, et l'exploitant conclut à une perte de données alors que les
# siennes dorment intactes sous l'autre préfixe. C'est le seul geste de ce
# rôle qui puisse faire croire à un désastre, d'où ce contrôle explicite.
- name: "Volumes de données déjà présents sur l'hôte"
  ansible.builtin.command:
    cmd: docker volume ls --format '{% raw %}{{.Name}}{% endraw %}'
  register: _volumes
  changed_when: false
  check_mode: false      # lecture seule : doit tourner aussi en --check

- name: "Le nom de projet correspond-il aux volumes existants ?"
  ansible.builtin.set_fact:
    _project: "{{ ciso_env.COMPOSE_PROJECT_NAME }}"
    _foreign_pgdata: >-
      {{ _volumes.stdout_lines | select('search', '-pgdata$')
         | reject('search', '^' ~ ciso_env.COMPOSE_PROJECT_NAME ~ '_')
         | list }}
    _own_pgdata: >-
      {{ _volumes.stdout_lines
         | select('search', '^' ~ ciso_env.COMPOSE_PROJECT_NAME ~ '_.*-pgdata$')
         | list }}

- name: "Refuser de démarrer à côté de données existantes"
  ansible.builtin.assert:
    that: _own_pgdata | length > 0 or _foreign_pgdata | length == 0
    fail_msg: >-
      COMPOSE_PROJECT_NAME vaut « {{ _project }} », mais aucun volume
      {{ _project }}_*-pgdata n'existe alors que l'hôte en porte d'autres :
      {{ _foreign_pgdata | join(', ') }}.
      Démarrer maintenant créerait des bases VIDES à côté de vos données.
      Corrigez ciso_env.COMPOSE_PROJECT_NAME pour qu'il corresponde au
      préfixe ci-dessus, ou retirez ces volumes si vous voulez repartir de
      zéro en connaissance de cause.
    success_msg: >-
      {{ _own_pgdata | length }} volume(s) de données pour le projet
      « {{ _project }} » — la stack retrouvera ses bases.

# Les conteneurs portent des noms fixes (ciso-pilot, ciso-risk-db…). Si une
# stack du même projet existe depuis un AUTRE répertoire — cas d'un
# déplacement de /home vers /opt — `up -d` échoue sur un conflit de noms au
# message obscur. Compose étiquette chaque conteneur avec son répertoire
# d'origine : on interroge le démon, pas le système de fichiers, et on le lit
# pour dire précisément quoi faire.
#
# On sonde TOUS les conteneurs du projet, pas seulement ciso-pilot : une stack
# partielle (Pilot retiré à la main, modules restants) échapperait sinon au
# contrôle tout en faisant échouer le démarrage.
- name: "Conteneurs d'une stack existante ?"
  ansible.builtin.command:
    cmd: >-
      docker ps -a
      --filter label=com.docker.compose.project={{ ciso_env.COMPOSE_PROJECT_NAME }}
      --format '{% raw %}{{.Label "com.docker.compose.project.working_dir"}}|{{.State}}{% endraw %}'
  register: _existing
  changed_when: false
  failed_when: false
  check_mode: false      # lecture seule : doit tourner aussi en --check

- name: "État et provenance des conteneurs existants"
  ansible.builtin.set_fact:
    _other_dirs: >-
      {{ _existing.stdout_lines | map('regex_replace', '\|.*$', '')
         | reject('equalto', ciso_deploy_dir) | reject('equalto', '')
         | unique | list }}
    _other_up: >-
      {{ _existing.stdout_lines | select('search', '\|running$')
         | list | length > 0 }}

# `docker compose stop` ne suffit PAS : il arrête les conteneurs sans les
# supprimer, et leurs noms restent réservés. C'est le geste naturel quand on
# lit « une stack tourne déjà », d'où la distinction explicite ci-dessous.
- name: "Refuser de démarrer une seconde stack depuis un autre répertoire"
  ansible.builtin.assert:
    that: _other_dirs | length == 0
    fail_msg: >-
      Des conteneurs du projet « {{ ciso_env.COMPOSE_PROJECT_NAME }} » existent
      déjà ({{ "certains en cours d'exécution" if _other_up | bool else "arrêtés, mais toujours présents" }})
      et proviennent de {{ _other_dirs | map('regex_replace', '^(.*)$', '« \1 »') | join(', ') }},
      alors que ce déploiement vise « {{ ciso_deploy_dir }} ». Leurs noms étant
      fixes, démarrer ici échouerait sur un conflit.
      {{ "Attention : `docker compose stop` ne libère pas les noms — il faut SUPPRIMER les conteneurs." if not (_other_up | bool) else "" }}
      Utilisez `down`, SANS -v qui détruirait les volumes :
      {% for d in _other_dirs %}  cd {{ d }} && docker compose down
      {% endfor %}
      Les données sont dans les volumes {{ ciso_env.COMPOSE_PROJECT_NAME }}_*,
      indépendants du répertoire : elles seront retrouvées ici.
    success_msg: >-
      Aucun conteneur du projet « {{ ciso_env.COMPOSE_PROJECT_NAME }} » ne
      provient d'un autre répertoire — pas de conflit de noms attendu.

# Après un déplacement, `down` supprime les conteneurs et donc leurs politiques
# `restart`. Mais un mécanisme EXTERNE — unité systemd, cron @reboot, rc.local —
# qui relance l'ancien répertoire survit à l'opération et ne se manifeste qu'au
# prochain redémarrage : deux stacks se disputent alors les mêmes noms de
# conteneurs et les mêmes ports, des semaines après la bascule.
#
# La release s'appuie sur `restart: unless-stopped`, donc AUCUN mécanisme
# externe n'est nécessaire ici : tout ce qu'on trouve est suspect.
- name: "Mécanismes de démarrage au boot pointant ailleurs"
  ansible.builtin.shell:
    cmd: >-
      grep -rnsE 'docker[ -]compose'
      /etc/systemd/system /etc/cron.d /etc/crontab /var/spool/cron/crontabs
      2>/dev/null | grep -v {{ ciso_deploy_dir | quote }} || true
  register: _boot_hooks
  changed_when: false
  check_mode: false      # lecture seule : doit tourner aussi en --check

- name: "Avertir d'un démarrage automatique concurrent"
  ansible.builtin.debug:
    msg: >-
      ATTENTION — un mécanisme de démarrage automatique référence un
      déploiement autre que « {{ ciso_deploy_dir }} ». Au prochain
      redémarrage, deux stacks se disputeront les mêmes noms de conteneurs.
      La release utilise `restart: unless-stopped` et n'a besoin d'aucune
      unité ni cron : désactivez ce qui suit.
      {{ _boot_hooks.stdout_lines | join(' | ') }}
  when: _boot_hooks.stdout | trim | length > 0

- name: "Tirer les images de la release"
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ ciso_deploy_dir }}"
  changed_when: true

- name: "Démarrer la stack"
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ ciso_deploy_dir }}"
  changed_when: true

- name: "Attendre que les services soient sains"
  ansible.builtin.shell:
    cmd: >-
      docker compose ps --format '{% raw %}{{.Service}} {{.Health}}{% endraw %}'
      | grep -- '-app ' | grep -cv healthy || true
    chdir: "{{ ciso_deploy_dir }}"
  register: _unhealthy
  until: _unhealthy.stdout | trim == "0"
  retries: 30
  delay: 10
  changed_when: false

# Le contrôle qui a manqué lors d'une migration réelle : ni le contenu du
# compose ni l'absence d'erreur dans les logs ne prouvent qu'un conteneur
# tourne sur la bonne image. Seule la colonne Image de `compose ps` fait foi.
- name: "Images réellement en service"
  ansible.builtin.command:
    cmd: docker compose ps --format '{% raw %}{{.Service}}\t{{.Image}}{% endraw %}'
    chdir: "{{ ciso_deploy_dir }}"
  register: _running_images
  changed_when: false

- name: "Récapitulatif des images"
  ansible.builtin.debug:
    var: _running_images.stdout_lines
