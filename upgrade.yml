---
# Upgrade to another suite release.
#
#   1. change ciso_suite_version in group_vars/all/main.yml
#   2. ansible-playbook upgrade.yml
#
# This playbook does what site.yml does, plus the checks that only make sense
# during an update. It refuses to run without a prior backup: Alembic
# migrations are not reversible.
- name: "CISO Toolbox — upgrade"
  hosts: ciso
  become: true
  # Fact gathering is REQUIRED: ansible_date_time timestamps the dumps.
  # Without it, the very first useful task fails on an undefined variable.
  gather_facts: true

  pre_tasks:
    - name: Currently deployed version
      ansible.builtin.command:
        cmd: git -C "{{ ciso_deploy_dir }}/suite" describe --tags --exact-match
      register: _current
      changed_when: false
      failed_when: false

    - name: Version — from … to …
      ansible.builtin.debug:
        msg: "{{ _current.stdout | default('inconnue', true) }} → {{ ciso_suite_version }}"

    # 0700 root: a dump contains every database in the clear.
    - name: Dumps directory
      ansible.builtin.file:
        path: "{{ ciso_deploy_dir }}/dumps"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # An Alembic migration does not replay backwards. Without a dump, a
    # failure mid-update leaves no way back.
    - name: Safety dump of every database
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          docker compose exec -T {{ item }}-db pg_dump -U {{ item }} {{ item }}
          | gzip > {{ ciso_deploy_dir }}/dumps/{{ item }}-{{ ansible_date_time.date }}.sql.gz
        chdir: "{{ ciso_deploy_dir }}"
        executable: /bin/bash
      loop: "{{ ciso_backup_expect_stanzas }}"
      register: _dumps
      failed_when: _dumps.rc != 0
      changed_when: true

    - name: Dumps produced
      ansible.builtin.find:
        paths: "{{ ciso_deploy_dir }}/dumps"
        patterns: "*-{{ ansible_date_time.date }}.sql.gz"
        size: 1k          # an empty dump signals an unreachable database
      register: _dump_files

    - name: Refuse the update if a dump is empty or missing
      ansible.builtin.assert:
        that: _dump_files.files | length == ciso_backup_expect_stanzas | length
        fail_msg: >-
          {{ _dump_files.files | length }} usable dump(s) for
          {{ ciso_backup_expect_stanzas | length }} expected database(s).
          Update aborted — without a backup, a failed migration would be
          irreversible.

  roles:
    - { role: ciso_stack, tags: [stack] }

  post_tasks:
    # Migrations apply when the container starts. If they failed, the module
    # runs on a schema that does not match its code.
    - name: Migrations applied at startup
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          docker compose logs --since 10m {{ item }}-app 2>&1
          | grep -iE 'running upgrade|alembic' | tail -5 || true
        chdir: "{{ ciso_deploy_dir }}"
        executable: /bin/bash
      loop: "{{ ciso_backup_expect_stanzas }}"
      register: _migrations
      changed_when: false

    - name: Migration trace
      ansible.builtin.debug:
        msg: "{{ item.item }} : {{ item.stdout_lines | default(['(aucune)']) }}"
      loop: "{{ _migrations.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Application errors since the update
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          docker compose logs --since 10m 2>&1
          | grep -icE 'traceback|critical|refusing to start' || true
        chdir: "{{ ciso_deploy_dir }}"
        executable: /bin/bash
      register: _errors
      changed_when: false

    - name: Alert on startup errors
      ansible.builtin.debug:
        msg: >-
          {{ _errors.stdout | trim }} error line(s) in the logs since the
          update — inspect with: docker compose logs --since 10m
      when: (_errors.stdout | trim | int) > 0

    - name: Backup checks
      ansible.builtin.include_role:
        name: backup_verify
