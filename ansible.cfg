[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
host_key_checking    = True
# `stdout_callback = yaml` désignait community.general.yaml, RETIRÉ en
# version 12 de la collection. Depuis ansible-core 2.13 la même sortie
# s'obtient par une option du greffon par défaut.
result_format        = yaml
retry_files_enabled  = False
forks                = 5
interpreter_python   = /usr/bin/python3
# vault_password_file intentionnellement absent : le forcer ici fait
# échouer jusqu'au --syntax-check sur un dépôt fraîchement cloné. Choisir
#   export ANSIBLE_VAULT_PASSWORD_FILE=.vault_pass
# ou  ansible-playbook … --ask-vault-pass

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
pipelining = True
