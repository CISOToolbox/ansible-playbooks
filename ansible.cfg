[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
host_key_checking    = True
# `stdout_callback = yaml` referred to community.general.yaml, REMOVED in
# version 12 of the collection. Since ansible-core 2.13 the same output is
# obtained through an option of the default plugin.
result_format        = yaml
retry_files_enabled  = False
forks                = 5
interpreter_python   = /usr/bin/python3
# vault_password_file deliberately absent: forcing it here makes even
# --syntax-check fail on a freshly cloned repository. Choose either
#   export ANSIBLE_VAULT_PASSWORD_FILE=.vault_pass
# or  ansible-playbook … --ask-vault-pass

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
pipelining = True
