---
# Installation and convergence of a CISO Toolbox host (Ubuntu 24.04 LTS).
#
#   ansible-playbook site.yml
#   ansible-playbook site.yml --tags stack     # redeploy the stack alone
#   ansible-playbook site.yml --check          # dry run
#
# Idempotent: replay at will. An upgrade is done by changing
# ciso_suite_version and then running upgrade.yml, which adds the checks
# specific to an update (migrations, images actually in service).
- name: "CISO Toolbox — host and stack"
  hosts: ciso
  become: true
  gather_facts: true
  roles:
    - { role: common,   tags: [common] }
    - { role: docker,   tags: [docker] }
    - { role: firewall, tags: [firewall] }
    - { role: ciso_stack, tags: [stack] }
  post_tasks:
    - name: Backup checks
      ansible.builtin.include_role:
        name: backup_verify
      tags: [backup]
