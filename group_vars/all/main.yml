---
# ─────────────────────────────────────────────────────────────────────────
# CISO Toolbox — common variables (NON-secret values)
#
# Secrets live in group_vars/all/vault.yml, encrypted with ansible-vault.
# The DIRECTORY form is mandatory: Ansible loads every file under
# group_vars/all/, but would associate a file named
# group_vars/all.vault.yml with a group called "all.vault" that does not
# exist — it would never be read, and the variables would be missing at
# run time.
# ─────────────────────────────────────────────────────────────────────────

# The suite version deployed. This is THE variable that drives upgrades: the
# playbook fetches docker-compose.yml and nginx.conf at that exact tag of the
# public repository. A tag describes a combination of modules tested together
# (see the compatibility matrix in RELEASING.md) — hence the ban on writing
# "main" here.
ciso_suite_version: "v0.9.2"
ciso_suite_repo: "https://github.com/CISOToolbox/suite.git"

# Where the stack is deployed on the host.
ciso_deploy_dir: "/opt/ciso-toolbox"
ciso_deploy_user: "ciso"

# Domain served by the proxy. Must match the certificate's SAN.
ciso_domain: "ciso.example.com"
ciso_http_port: 80
ciso_https_port: 443

# Modules actually deployed. Used for two things: the PILOT_MODULES variable
# (Pilot only shows those) and the health checks. Removing a module here does
# not remove it from docker-compose.yml — see README, "Removing a module".
ciso_modules:
  - risk
  - compliance
  - vendor
  - asset
  - access
  - audit
  - surface
  - appsec
  - watch

# Client images, replacing the suite image of the matching module. Leave
# empty for a standard deployment. Example:
#   ciso_client_images:
#     surface: "ghcr.io/cisotoolbox/ciso-surface-acme:v1.0.0"
#     access:  "ghcr.io/cisotoolbox/ciso-access-acme:v1.0.0"
ciso_client_images: {}

# Registry: only needed when (private) client images are used. The password
# lives in the vault.
ciso_registry: "ghcr.io"
ciso_registry_user: ""

# TLS certificates. Three modes:
#   "provided"   — files supplied from the control node
#                  (files/certs/<domain>/cert.pem + key.pem)
#   "selfsigned" — generated locally, for a mock-up only
#   "existing"   — already on the host (ACME, corporate PKI, taking over an
#                  existing deployment): the role checks they are there and
#                  fixes their permissions, without overwriting them
ciso_tls_mode: "provided"

# File names inside <deploy_dir>/certs/. These are the ones the release's
# nginx.conf expects.
ciso_tls_cert_name: "cert.pem"
ciso_tls_key_name: "key.pem"

# Ports opened by ufw. 22 is essential; removing it costs you access to the
# host at the first `ufw enable`.
ciso_firewall_ports:
  - "22"
  - "{{ ciso_http_port }}"
  - "{{ ciso_https_port }}"

# Backups: the stack embeds backup-agent (pgBackRest). These values only
# drive the playbook's checks; the real scheduling lives in the container.
ciso_backup_expect_stanzas: "{{ ciso_modules + ['pilot'] }}"

# Contents of the .env, NON-secret part. The secret part lives in vault_env
# (group_vars/all/vault.yml) and wins on a shared key.
# Taking over an existing deployment: bash extract-env.sh /path/to/.env
ciso_env:
  COMPOSE_PROJECT_NAME: "ciso"
  APP_URL: "https://{{ ciso_domain }}"
  PUBLIC_BASE_URL: "https://{{ ciso_domain }}"
  HTTP_PORT: "{{ ciso_http_port }}"
  HTTPS_PORT: "{{ ciso_https_port }}"
  PILOT_MODULES: "{{ ciso_modules | join(',') }}"
  AUTH_MODE: "pilot"

# Docker source: "distro" (docker.io + docker-compose-v2, signed by Ubuntu,
# no third-party repository) or "docker-ce" (Docker Inc.'s official
# repository). Has no effect when a working Docker is already present: it is
# never replaced, the two packages being in conflict.
ciso_docker_source: "distro"

# The host firewall is not managed by default — see roles/firewall/defaults.
# ciso_firewall_manage: true

# ─────────────────────────────────────────────────────────────────────────
# Off-site backup to S3-compatible object storage. OPTIONAL.
# ─────────────────────────────────────────────────────────────────────────
# The pgBackRest repository lives in a Docker volume, on the SAME host and
# the same disk as the databases it protects. That covers logical failure,
# not losing the host: dead disk, destroyed VM, ransomware — databases and
# backups then disappear together.
#
# Empty dictionary ⇒ no off-site backup, behaviour unchanged. Credentials
# and the passphrase go in the vault (ciso_backup_s3_secret), never here.
ciso_backup_s3: {}
#   bucket: "my-ciso-backups"
#   endpoint: "s3.fr-par.scw.cloud"
#   region: "fr-par"
#   path: "/pgbackrest"
#   retention_full: 4
#   test_day: "01"           # day of month for the off-site restore test
#   uri_style: "host"        # "path" for MinIO and compatibles
#   storage_ca_file: "/opt/ciso-toolbox/certs/minio-ca.crt"  # HOST path

# S3 secrets, to be defined in group_vars/all/vault.yml:
#   ciso_backup_s3_secret:
#     key: "..."
#     key_secret: "..."
#     cipher_pass: "..."     # optional; falls back to BACKUP_CIPHER_PASS
ciso_backup_s3_secret: {}

# How many days the off-site repository may lag before verify.yml fails.
ciso_backup_s3_max_age_days: 3

# TLS validation for the checks in verify.yml. On by default, except in
# selfsigned mode. Set to false when the certificate comes from a corporate
# PKI absent from the host trust store — or better, point ciso_verify_tls_ca
# at the CA bundle, which keeps the check able to notice a bad certificate.
# ciso_verify_tls: false
# ciso_verify_tls_ca: "/usr/local/share/ca-certificates/corp-root.crt"
