---
# Operational checks, writing nothing.
#
#   ansible-playbook verify.yml
- name: "CISO Toolbox — checks"
  hosts: ciso
  become: true
  gather_facts: false
  tasks:
    - name: Images actually in service
      ansible.builtin.command:
        cmd: docker compose ps --format '{% raw %}{{.Service}}\t{{.Image}}\t{{.Status}}{% endraw %}'
        chdir: "{{ ciso_deploy_dir }}"
      register: _ps
      changed_when: false

    - name: Stack state
      ansible.builtin.debug:
        var: _ps.stdout_lines

    # Certificate validation is on by default — an "existing" certificate from
    # ACME or a corporate PKI is as valid as a provided one, and an expired or
    # wrong certificate should be noticed here.
    #
    # A corporate PKI absent from the host's trust store is the exception:
    # set ciso_verify_tls to false, or point ciso_verify_tls_ca at the CA
    # bundle. Turning validation off blinds this check to certificate
    # problems, so prefer the CA bundle when you have it.
    - name: HTTP response of each module through the edge
      ansible.builtin.uri:
        url: "https://{{ ciso_domain }}/{{ item }}/"
        validate_certs: "{{ ciso_verify_tls | default(ciso_tls_mode != 'selfsigned') }}"
        ca_path: "{{ ciso_verify_tls_ca | default(omit) }}"
        status_code: [200, 302, 401]
      loop: "{{ ciso_modules }}"
      register: _http
      failed_when: false
      changed_when: false

    # Two failures that look alike and are not: a module that answers the
    # wrong code is a module in trouble; a module that answers nothing at all
    # (status -1) means the request never completed — DNS, routing, or a
    # certificate the host does not trust. Reporting both as "unreachable"
    # sent three diagnoses down the wrong path.
    - name: Modules answering an unexpected code
      ansible.builtin.debug:
        msg: >-
          {{ _http.results | selectattr('status', 'defined')
             | rejectattr('status', 'in', [200, 302, 401, -1])
             | map(attribute='item') | list | default('none', true) }}

    - name: Modules that did not answer at all
      ansible.builtin.debug:
        msg: >-
          {{ _http.results | selectattr('status', 'defined')
             | selectattr('status', 'equalto', -1) | map(attribute='item')
             | list | default('none', true) }}
          {{ '— the request never completed. First candidate: a certificate
              the host does not trust (corporate PKI). ' ~
              (_http.results | selectattr('status', 'equalto', -1)
               | map(attribute='msg') | first | default(''))[:200]
             if (_http.results | selectattr('status', 'defined')
                 | selectattr('status', 'equalto', -1) | list | length > 0)
             else '' }}

    # The off-site repository is the one whose failure is SILENT: expired
    # credentials, a moved bucket, a retention policy imposed by the provider.
    # The local one makes itself known immediately. "Local fresh, off-site
    # behind" is therefore the failure mode to detect.
    #
    # No embedded Python here. The previous version passed a one-liner to
    # python3 through a folded YAML block: folding preserves the source
    # indentation, python refuses it, and the check died with an
    # IndentationError on every host — silently, because its result was only
    # read through a `when` condition. A check that cannot run must fail, and
    # a check should not need a second language to do its job.
    - name: Off-site repository state per stanza
      ansible.builtin.command:
        cmd: >-
          docker compose exec -T backup-agent
          pgbackrest --stanza={{ item }} --repo=2 info --output=json
        chdir: "{{ ciso_deploy_dir }}"
      loop: "{{ ciso_backup_expect_stanzas }}"
      register: _s3_info
      changed_when: false
      failed_when: false
      when: ciso_backup_s3 | default({}) | length > 0

    # Reduced to one timestamp per stanza before asserting. Asserting inside
    # the loop made Ansible echo the whole pgbackrest JSON for every module —
    # ten unreadable blocks to say "everything is fine", on a check meant to
    # be run routinely. A check nobody reads is a check nobody runs.
    #
    # -1 marks a command that failed, 0 a stanza holding no backup at all.
    - name: Newest off-site backup per stanza
      ansible.builtin.set_fact:
        _s3_newest: >-
          {{ (_s3_newest | default({})) | combine({
               item.item: (item.rc == 0)
               | ternary((item.stdout | from_json | first).backup | default([])
                         | map(attribute='timestamp.stop') | list | max | default(0), -1) }) }}
      loop: "{{ _s3_info.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('?') }}"
      when: ciso_backup_s3 | default({}) | length > 0

    - name: Off-site repository state
      ansible.builtin.assert:
        that:
          - _s3_newest | dict2items | selectattr('value', 'equalto', -1) | list | length == 0
          - _s3_newest | dict2items | selectattr('value', 'equalto', 0) | list | length == 0
          - _s3_newest | dict2items | rejectattr('value', 'in', [0, -1])
            | selectattr('value', 'lt', (lookup('pipe', 'date +%s') | int)
              - (ciso_backup_s3_max_age_days | default(3) | int) * 86400)
            | list | length == 0
        fail_msg: >-
          Off-site backup problem — three different remedies:
          {% set ko = _s3_newest | dict2items | selectattr('value', 'equalto', -1) | map(attribute='key') | list %}
          {% set vide = _s3_newest | dict2items | selectattr('value', 'equalto', 0) | map(attribute='key') | list %}
          {% set vieux = _s3_newest | dict2items | rejectattr('value', 'in', [0, -1])
             | selectattr('value', 'lt', (lookup('pipe', 'date +%s') | int)
               - (ciso_backup_s3_max_age_days | default(3) | int) * 86400)
             | map(attribute='key') | list %}
          {{ "the info command FAILED for: " ~ (ko | join(', ')) ~ " (credentials, network, or the repository is unreachable). " if ko else "" }}
          {{ "NO backup at all off-site for: " ~ (vide | join(', ')) ~ " (the recovery window is not open — force a full backup). " if vide else "" }}
          {{ "older than " ~ (ciso_backup_s3_max_age_days | default(3)) ~ " days: " ~ (vieux | join(', ')) ~ " (the agent is no longer pushing off-site)." if vieux else "" }}
        success_msg: >-
          Off-site repository up to date for the
          {{ _s3_newest | length }} stanza(s).
      when: ciso_backup_s3 | default({}) | length > 0

    - name: Backup checks
      ansible.builtin.include_role:
        name: backup_verify
