---
# Operational checks, writing nothing.
#
#   ansible-playbook verify.yml
- name: "CISO Toolbox — checks"
  hosts: ciso
  become: true
  gather_facts: false
  tasks:
    - name: Images actually in service
      ansible.builtin.command:
        cmd: docker compose ps --format '{% raw %}{{.Service}}\t{{.Image}}\t{{.Status}}{% endraw %}'
        chdir: "{{ ciso_deploy_dir }}"
      register: _ps
      changed_when: false

    - name: Stack state
      ansible.builtin.debug:
        var: _ps.stdout_lines

    - name: HTTP response of each module through the edge
      ansible.builtin.uri:
        url: "https://{{ ciso_domain }}/{{ item }}/"
        # An "existing" certificate comes from ACME or a corporate PKI: it is
        # just as valid as a "provided" one. Only the self-signed case fails
        # validation, and only it should be exempt.
        validate_certs: "{{ ciso_tls_mode != 'selfsigned' }}"
        status_code: [200, 302, 401]
      loop: "{{ ciso_modules }}"
      register: _http
      failed_when: false
      changed_when: false

    - name: Unreachable modules
      ansible.builtin.debug:
        msg: >-
          {{ _http.results | rejectattr('status', 'in', [200, 302, 401])
             | map(attribute='item') | list | default('none', true) }}

    # The off-site repository is the one whose failure is SILENT: expired
    # credentials, a moved bucket, a retention policy imposed by the provider.
    # The local one makes itself known immediately. "Local fresh, off-site
    # behind" is therefore the failure mode to detect.
    - name: Off-site repository freshness
      ansible.builtin.shell:
        cmd: >-
          docker compose exec -T backup-agent python3 -c "
          import json,subprocess,time,sys;
          mods='{{ ciso_backup_expect_stanzas | join(' ') }}'.split();
          out=[];
          [out.append((m, max([b['timestamp']['stop'] for r in
            json.loads(subprocess.run(['pgbackrest','--stanza='+m,'--repo=2','info','--output=json'],
            capture_output=True,text=True).stdout or '[]') for b in r['backup']] or [0])))
            for m in mods];
          now=time.time();
          print('\n'.join(f'{m} {int((now-t)/86400) if t else -1}' for m,t in out))"
        chdir: "{{ ciso_deploy_dir }}"
      register: _s3_age
      changed_when: false
      failed_when: false
      when: ciso_backup_s3 | default({}) | length > 0

    - name: Off-site repositories lagging
      ansible.builtin.assert:
        that: >-
          _s3_age.stdout_lines
          | map('regex_replace', '^\S+ ', '') | map('int')
          | select('>', ciso_backup_s3_max_age_days | default(3))
          | list | length == 0
        fail_msg: >-
          Off-site backup lagging (threshold
          {{ ciso_backup_s3_max_age_days | default(3) }} days):
          {{ _s3_age.stdout_lines | join(' | ') }}.
          A "-1" means a stanza with NO backup at all on the off-site
          repository — the protection against losing the host does not exist.
        success_msg: >-
          Off-site repository up to date: {{ _s3_age.stdout_lines | join(' | ') }}
      when:
        - ciso_backup_s3 | default({}) | length > 0
        - _s3_age.stdout | default('') | trim | length > 0

    - name: Backup checks
      ansible.builtin.include_role:
        name: backup_verify
